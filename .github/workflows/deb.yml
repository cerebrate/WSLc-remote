name: deb package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: [debian:stable, ubuntu:22.04, ubuntu:24.04]
    steps:
      - name: Install tooling
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates lintian shellcheck
      - uses: actions/checkout@v4
      - name: Build, install and test the package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/deb/tests/test.sh
      - name: Keep the built package
        if: matrix.image == 'ubuntu:24.04'
        uses: actions/upload-artifact@v4
        with:
          name: wslc-remote-deb
          path: packaging/deb/dist/*.deb
